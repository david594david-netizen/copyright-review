<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研究生論文參考文獻檢核系統 - 南開科技大學教務處開發測試版</title>
    
    <!-- 1. 引入 Tailwind CSS (負責畫面排版與美化) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 引入 React 與 ReactDOM (負責核心邏輯與畫面渲染) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 3. 引入 Babel (瀏覽器端的即時 JSX 翻譯機) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- React 應用程式的掛載點 -->
    <div id="root"></div>

    <!-- 4. 我們的核心程式碼 (注意 type 是 text/babel) -->
    <script type="text/babel">
        const { useState } = React;

        // --- 內建圖示元件 (取代外部模組，確保單一檔案能運作) ---
        const CheckCircle = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const AlertTriangle = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
        const XCircle = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const Search = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>;
        const BookOpen = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>;
        const ExternalLink = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>;
        const FileEdit = ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>;
        // Loader 動畫圖示
        const Loader2 = ({className}) => <svg className={`${className} animate-spin`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;

        // --- 主應用程式元件 ---
        function App() {
            const [inputText, setInputText] = useState('');
            const [results, setResults] = useState([]);
            const [isChecking, setIsChecking] = useState(false);
            const [progress, setProgress] = useState({ current: 0, total: 0 });

            // APA 7th 格式檢查邏輯
            const checkAPA7Format = (text) => {
                const warnings = [];
                if (!/\(\d{4}\)\./.test(text)) warnings.push("缺少標準的年份格式，應為「(出版年).」。例如：(2023).");
                if (/\b and \b/i.test(text)) warnings.push("作者列表的連接詞應使用「&」而非「and」。");
                if (/\bdoi:/i.test(text) && !/https:\/\/doi\.org\//i.test(text)) {
                    warnings.push("APA 7th 規定 DOI 應直接以「https://doi.org/」開頭，請移除「doi:」字眼。");
                } else if (!/https:\/\/doi\.org\//.test(text) && /10\.\d{4,9}\/[-._;()/:A-Z0-9]+/i.test(text)) {
                    warnings.push("內文包含 DOI 碼，但缺少「https://doi.org/」前綴。");
                }
                if (/\bpp?\. \d+/i.test(text)) warnings.push("若此為期刊論文，頁碼前不需加「p.」或「pp.」；若是書籍章節則保留。");
                if (/Retrieved from/i.test(text) && !/Retrieved \w+ \d+, \d{4}, from/i.test(text)) {
                    warnings.push("APA 7th 除非網頁內容會頻繁變動，否則通常不需要寫「Retrieved from」，直接附上網址即可。");
                }
                return warnings;
            };

            // 處理文獻檢核的核心邏輯
            const handleCheck = async () => {
                const lines = inputText.split('\n').map(line => line.trim()).filter(line => line.length > 10);
                
                if (lines.length === 0) {
                    alert("請輸入至少一筆參考文獻！");
                    return;
                }

                setIsChecking(true);
                setResults([]);
                setProgress({ current: 0, total: lines.length });

                const tempResults = [];

                for (let i = 0; i < lines.length; i++) {
                    const ref = lines[i];
                    const formatWarnings = checkAPA7Format(ref); 

                    try {
                        const response = await fetch(`https://api.crossref.org/works?query.bibliographic=${encodeURIComponent(ref)}&rows=1&select=title,author,DOI,score`);
                        
                        if (!response.ok) throw new Error('API Request Failed');
                        
                        const data = await response.json();
                        const items = data.message.items;

                        if (items && items.length > 0) {
                            const topMatch = items[0];
                            const score = topMatch.score;
                            const dbTitle = topMatch.title ? topMatch.title[0] : '';
                            
                            // 標題相似度比對邏輯 (100% 嚴格比對)
                            let isTitleMatch = false;
                            if (dbTitle) {
                                const normalize = str => str.toLowerCase().replace(/[^\w\s]/gi, '').replace(/\s+/g, ' ').trim();
                                const cleanDbTitle = normalize(dbTitle);
                                const cleanInput = normalize(ref);
                                isTitleMatch = cleanDbTitle.length > 0 && cleanInput.includes(cleanDbTitle);
                            }

                            let status, message;
                            if (score > 60 && isTitleMatch) {
                                status = 'verified';
                                message = '文獻已驗證 (關聯與標題皆吻合)';
                            } else if (score > 60 && !isTitleMatch) {
                                status = 'danger';
                                message = '高度疑似 AI 拼湊幻覺 (高關聯但標題不符)';
                            } else if (score > 20) {
                                status = 'warning';
                                message = '關聯度偏低，需人工確認';
                            } else {
                                status = 'danger';
                                message = '高度疑似 AI 幻覺 (查無紀錄)';
                            }

                            tempResults.push({
                                originalText: ref,
                                status: status,
                                message: message,
                                score: score.toFixed(1),
                                title: dbTitle || '無標題',
                                doi: topMatch.DOI || '',
                                formatWarnings: formatWarnings
                            });
                        } else {
                            tempResults.push({
                                originalText: ref,
                                status: 'danger',
                                message: '資料庫完全無此紀錄',
                                score: 0,
                                title: '',
                                doi: '',
                                formatWarnings: formatWarnings
                            });
                        }
                    } catch (error) {
                        console.error("API 錯誤:", error);
                        tempResults.push({
                            originalText: ref,
                            status: 'error',
                            message: '檢核過程發生錯誤',
                            score: null,
                            title: '',
                            doi: '',
                            formatWarnings: formatWarnings
                        });
                    }
                    
                    setProgress({ current: i + 1, total: lines.length });
                    await new Promise(resolve => setTimeout(resolve, 500));
                }

                setResults(tempResults);
                setIsChecking(false);
            };

            const renderStatusIcon = (status) => {
                switch (status) {
                    case 'verified': return <CheckCircle className="text-green-500 w-6 h-6" />;
                    case 'warning': return <AlertTriangle className="text-yellow-500 w-6 h-6" />;
                    case 'danger': return <XCircle className="text-red-500 w-6 h-6" />;
                    default: return <AlertTriangle className="text-gray-400 w-6 h-6" />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-indigo-700 text-white shadow-md py-6 px-8">
                        <div className="max-w-5xl mx-auto flex items-center space-x-3">
                            <BookOpen className="w-8 h-8 text-indigo-200" />
                            <div>
                                <div className="text-indigo-200 text-sm font-semibold mb-1 tracking-wider">南開科技大學教務處開發</div>
                                <h1 className="text-2xl font-bold tracking-wide">研究生論文參考文獻檢核系統</h1>
                                <p className="text-indigo-200 text-sm mt-1">含 APA 7th 格式自動診斷與 AI 幻覺偵測</p>
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow max-w-5xl mx-auto w-full py-8 px-4 md:px-8">
                        <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
                            <label className="block text-slate-700 font-semibold mb-2 text-lg">
                                貼上您的參考文獻 (References)
                            </label>
                            <p className="text-slate-500 text-sm mb-4">
                                請將論文後方的參考文獻列表貼於下方。系統將透過 Crossref API 檢核真實性，並提供 APA 7th 格式修正建議。
                            </p>
                            <textarea
                                className="w-full h-48 p-4 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm leading-relaxed outline-none"
                                placeholder="例如：&#10;Lin, D. and Chen, Y. (2023). The Impact of Assistive Technology on the Quality of Life. Journal of Aging Research, 45(2), pp. 112-128. doi:10.1234/jar.2023.01"
                                value={inputText}
                                onChange={(e) => setInputText(e.target.value)}
                                disabled={isChecking}
                            />
                            <div className="mt-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                                <div className="text-sm text-slate-500">
                                    {isChecking && (
                                        <span className="flex items-center text-indigo-600 font-medium">
                                            <Loader2 className="w-4 h-4 mr-2" />
                                            正在檢驗文獻與格式... ({progress.current} / {progress.total})
                                        </span>
                                    )}
                                </div>
                                <button
                                    onClick={handleCheck}
                                    disabled={isChecking || inputText.trim().length === 0}
                                    className={`flex items-center px-6 py-2.5 rounded-lg font-medium text-white transition-colors shadow-sm w-full sm:w-auto justify-center ${
                                        isChecking || inputText.trim().length === 0
                                            ? 'bg-slate-400 cursor-not-allowed'
                                            : 'bg-indigo-600 hover:bg-indigo-700'
                                    }`}
                                >
                                    {isChecking ? '分析中...' : (
                                        <React.Fragment>
                                            <Search className="w-4 h-4 mr-2" />
                                            開始檢核
                                        </React.Fragment>
                                    )}
                                </button>
                            </div>
                        </section>

                        {results.length > 0 && (
                            <section className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="px-6 py-4 border-b border-slate-200 bg-slate-100/50 flex justify-between items-center">
                                    <h2 className="text-lg font-semibold text-slate-800">檢核與格式診斷報告</h2>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse min-w-[800px]">
                                        <thead>
                                            <tr className="bg-slate-50 text-slate-500 text-sm uppercase tracking-wider">
                                                <th className="px-6 py-4 border-b w-24 text-center">狀態</th>
                                                <th className="px-6 py-4 border-b w-[40%]">原始輸入文獻</th>
                                                <th className="px-6 py-4 border-b w-[50%]">系統判定與格式建議</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {results.map((result, index) => (
                                                <tr key={index} className="hover:bg-slate-50 transition-colors">
                                                    <td className="px-6 py-4 text-center align-top">
                                                        <div className="flex justify-center mt-1">
                                                            {renderStatusIcon(result.status)}
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-4 text-sm text-slate-600 align-top break-words leading-relaxed">
                                                        {result.originalText}
                                                    </td>
                                                    <td className="px-6 py-4 align-top">
                                                        <div className="flex flex-col space-y-3">
                                                            <div>
                                                                <span className={`inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold w-max ${
                                                                    result.status === 'verified' ? 'bg-green-100 text-green-800' :
                                                                    result.status === 'warning' ? 'bg-yellow-100 text-yellow-800' :
                                                                    'bg-red-100 text-red-800'
                                                                }`}>
                                                                    {result.message} (關聯分數: {result.score})
                                                                </span>
                                                                
                                                                {result.title && (
                                                                    <div className="text-sm mt-2">
                                                                        <span className="font-medium text-slate-700">資料庫最吻合記錄：</span>
                                                                        <span className={`${result.status === 'danger' && result.score > 60 ? 'text-red-600 font-semibold' : 'text-slate-600'}`}>
                                                                            {result.title}
                                                                        </span>
                                                                        {result.status === 'danger' && result.score > 60 && (
                                                                            <div className="text-xs text-red-500 mt-1">
                                                                                ↑ 系統發現此標題與您輸入的文獻標題不符，極可能是 AI 使用真實作者與期刊拼湊出的假文獻。
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                )}
                                                                
                                                                {result.doi && (
                                                                    <div className="text-sm flex items-center mt-1">
                                                                        <span className="font-medium text-slate-700 mr-2">標準 DOI：</span>
                                                                        <a 
                                                                            href={`https://doi.org/${result.doi}`} 
                                                                            target="_blank" 
                                                                            rel="noopener noreferrer"
                                                                            className="text-indigo-600 hover:text-indigo-800 hover:underline flex items-center"
                                                                        >
                                                                            https://doi.org/{result.doi}
                                                                            <ExternalLink className="w-3 h-3 ml-1" />
                                                                        </a>
                                                                    </div>
                                                                )}
                                                            </div>

                                                            {result.formatWarnings && result.formatWarnings.length > 0 ? (
                                                                <div className="bg-blue-50 border border-blue-100 rounded-lg p-3 mt-2">
                                                                    <div className="flex items-center text-blue-800 text-sm font-semibold mb-1">
                                                                        <FileEdit className="w-4 h-4 mr-1.5" />
                                                                        APA 7th 格式修正建議：
                                                                    </div>
                                                                    <ul className="list-disc list-inside text-sm text-blue-700 space-y-1">
                                                                        {result.formatWarnings.map((warning, wIndex) => (
                                                                            <li key={wIndex}>{warning}</li>
                                                                        ))}
                                                                    </ul>
                                                                </div>
                                                            ) : (
                                                                <div className="text-sm text-emerald-600 flex items-center mt-2">
                                                                    <CheckCircle className="w-4 h-4 mr-1.5" />
                                                                    基本 APA 格式檢查通過 (提醒：請自行確認期刊名稱是否標示斜體)
                                                                </div>
                                                            )}
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </section>
                        )}
                    </main>
                    
                    <footer className="bg-slate-100 border-t border-slate-200 text-center py-6 text-slate-500 text-sm mt-auto">
                        <p>© {new Date().getFullYear()} 南開科技大學教務處開發. Powered by Crossref API.</p>
                        <p className="mt-1">指導教授叮嚀：此系統僅作「格式提示」與「文獻防偽」輔助，無法取代作者本人的仔細校對與閱讀。</p>
                    </footer>
                </div>
            );
        }

        // 渲染 React 應用程式到畫面上的 root 元素
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
